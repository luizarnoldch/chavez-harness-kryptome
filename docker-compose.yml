services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "25000:5432"
    environment:
      POSTGRES_USER: chavez
      POSTGRES_PASSWORD: chavez
      POSTGRES_DB: chavez
    volumes:
      - chavez_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chavez -d chavez"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chavez_pg_data:
