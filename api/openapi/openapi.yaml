  /ws:
    get:
      tags: [WebSocket]
      summary: Upgrade WebSocket
      description: |
        Autenticación: query `token` (Bearer, CLI) **o** cookie de sesión Better Auth
        (hub web). Si ambos fallan → 401.

        Tras el upgrade, el cliente envía mensajes JSON (ver schemas `WsClient*`)
        y recibe `ServerMessage`.

        **Tipos implementados:** `ping`, `daemon.heartbeat` (refresco de `lastSeen`;
        intervalo tipico 2s), `workspace.bind` (`clientKind` client|daemon;
        `hostname` del proceso; `daemonId` estable para reclaim),
        `workspace.unbind`, `session.create`, `session.list`, `chat.create`, `chat.list`,
        `chat.update` (rename/pin/archive/move), `chat.search` (acotado al workspace bound),
        `chat.append` (broadcast `message.appended`), `chat.get` (incluye `diffs` preview, `context` y `currentPlanArtifactId`),
        `chat.export` (`{ chatId, format? }` → `{ markdown, document }`; sin daemon; sin vault),
        `chat.import` (`{ sessionId, payload }` → `{ chat }` + broadcast `chat.created`; no re-ejecuta tools),
        `chat.share.create|get|revoke` (link de solo lectura; push `chat.share.updated` al dueño),
        `chat.replay` (`{ chatId, streamId? }` → `{ replay, text }`; solo lectura; sin daemon; no despacha turn),
        `chat.plan.list|update|setCurrent|apply|consume` (documento de plan en `chat_messages.metadata.kind=plan_artifact`;
        apply **no** corre git ni dispara un turn; consume limpia `pendingApply`),
        `chat.compact` (client→API; dispatch al daemon; timeout 90s; sin daemon = `NO_DAEMON_ERROR`),
        `chat.compact.result` (daemon→API), `chat.context.report` (daemon→API; broadcast `chat.context.usage`),
        `chat.diff.upsert` (daemon→API; persist por `(chatId, streamId, path)`;
        broadcast **sin** `body`; `dropped: true` si status=rejected),
        `chat.diff.get` (`{ chatId, diffId }` → `{ diff }` con `body` o `omitted`),
        `chat.stream.start|delta|end|error` (`chat.stream.delta.seq` lo emite el daemon;
        `chat.stream.end.status` es `finished|cancelled`),
        `chat.thinking.delta|end` (daemon→API; fan-out sin persistencia propia),
        `chat.tool.start|result|update`,
        chat.tool.* metadata.kind: verify | lint | bash | mcp | skill | subagent | git | read | write | other
        `chat.mcp.status` (daemon→API→broadcast; failed servers aviso system, nativas siguen),
        `chat.skill.activated`, `chat.subagent.start|update|end`, `chat.capability.degraded`,
        `workspace.mcp.snapshot`, `workspace.skills.snapshot` (client→API; dispatch al daemon;
        sin daemon = `NO_DAEMON_ERROR`), `workspace.mcp.dispatch`,
        `workspace.skills.dispatch` (API→daemon), `workspace.mcp.result`,
        `workspace.skills.result` (daemon→API) y pushes
        `workspace.mcp.changed|workspace.skills.changed`,
        `workspace.marketplace.snapshot|install|uninstall|approve|deny` (client→API;
        MCP install/uninstall escribe `.mcp.json` en el proyecto vía daemon),
        `marketplace.install.ask` (push de aprobación para escribir `.mcp.json`),
        `marketplace.changed` (push tras install/uninstall HTTP o WS de skills/MCP),
        MCP install is WebSocket-only; the API never spawns MCP servers.
        chat.stream.end metadata.verification: { status, kind, command, exitCode, timedOut, source, truncated }
        verify timeout → chat.stream.error error="Verification timed out after 120s" and the turn ends
        `agent.turn.request` (dispatch al daemon **primary**; `agent.turn.dispatch` incluye
        `executionMode` leído de preferencias, nunca del cliente, más `hostname`,
        `daemonId` y `daemonConnectionId`, más `memories[]` cargados por la API).
        Para code review, `agent.turn.request.metadata.kind = code_review` se reenvía en
        `agent.turn.dispatch`; si el prompt está vacío, la API usa el prompt de review por
        defecto. La API no llama a GitHub ni hidrata diffs,
        `memory.changed` (API→broadcast tras POST/DELETE `/memories`; `{ workspaceId, memories }`),
        `prompt.changed` (API→broadcast tras POST/PUT/DELETE `/prompts`; `{ prompts: SavedPrompt[] }`),
        `chat.stream.end` puede incluir `message.metadata.memory` `{ used, applied }`,
        `agent.turn.started`, `agent.turn.ended`, `agent.turn.steer`,
        `agent.turn.steer.result` (daemon→API; completa RPC y emite push `chat.steer`),
        `agent.turn.cancel`
        (idempotente: `ok, wasRunning: false` si no hay turn; sin daemon = mismo
        `NO_DAEMON_ERROR`),
        `chat.tool.update`, `agent.tool.approve`, `agent.tool.deny`
        (`agent.tool.approve` / `deny` hacen CAS: el primero gana y se reenvía
        al daemon; el segundo recibe error que incluye `ya resuelto` y no se
        reenvía. `chat.tool.update` con `awaiting_approval` incluye
        `approvalDeadline` ISO y `prompt` path+diff o command),
        Push: `chat.tool.resolved` `{ chatId, toolCallId, outcome, resolvedBy }`
        tras el CAS ganador o timeout del daemon,
        `fs.complete` (client→API, correlacionado), `fs.complete.result` (daemon→API),
        `fs.tree` (client→API, correlacionado), `fs.tree.result` (daemon→API),
        `fs.search` (client→API, correlacionado; máx 50 matches), `fs.search.result` (daemon→API),
        `fs.preview` (client→API, correlacionado), `fs.preview.result` (daemon→API),
        Error sin daemon en `fs.tree` / `fs.search` / `fs.preview` / `fs.complete`: el mismo string que `agent.turn.request`.
        `workspace.git.status|diff|commit|push|pr|branch` (client→API; dispatch al daemon;
        sin daemon = `NO_DAEMON_ERROR`; mutaciones con turnBusy = `TURN_BUSY_ERROR`),
        `workspace.git.result` (daemon→API, completa el pending),
        `workspace.worktree.list|add|select` (client→API correlacionados; dispatch al daemon;
        sin daemon = `NO_DAEMON_ERROR`; add/select con turnBusy = `TURN_BUSY_ERROR`),
        `workspace.worktree.dispatch` (API→daemon), `workspace.worktree.result` (daemon→API),
        `pty.open` (correlacionado; denegado si `metadata.ci`), `pty.input`, `pty.resize`,
        `pty.close`, `pty.open.result`, `pty.data` (solo owner), `pty.exit`, `pty.attach`,
        `pty.kill.dispatch`. PTY corre en el cwd del daemon; CI no tiene PTY.

        Push: `chat.updated` `{ chat }`, `chat.compact.done` `{ chatId, message, context }`,
        `chat.context.usage` `{ chatId, context }`, `chat.plan.created|updated|applied|current`,
        `chat.share.updated` `{ chatId, active }`,
        `workspace.cwd.changed` `{ workspaceId, hostname, cwd, bindPath, snapshot }`
        (`bindPath` = `workspaces.path`; `cwd` = worktree o bind efectivo).

        Push events: `{ push: true, eventId, type, data }` hacia otros sockets del user
        (`fs.complete.dispatch`, `fs.tree.dispatch`, `fs.search.dispatch` y `fs.preview.dispatch` al daemon bound;
        `workspace.git.dispatch` al daemon bound; `workspace.git.snapshot` y
        `github.pr.created` tras un PR real — no se emite si el push falla;
        `github.review.submitted` tras persistir un `chat.tool.result` exitoso de
        `git_pr_review` con `metadata.reviewUrl`;
        `prefs.updated` tras PUT
        `/providers/preferences`; `daemon.presence` al bind, unbind, reclaim,
        disconnect y when a daemon is stale (`lastSeen` > 5s) and evicted by the
        heartbeat sweep).

        Composer slash commands (/mode, /model, /provider, /compact, /clear, /undo, /cost, /help, /plan) are client-side. They never arrive as agent.turn.request. Feedback is chat.append role=system metadata.kind=slash_result. prefs.updated is broadcast after PUT /providers/preferences.
      operationId: websocketUpgrade
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Session / access token opcional (CLI). Si falta, se usa cookie.
        - name: Connection
          in: header
          schema:
            type: string
            example: Upgrade
        - name: Upgrade
          in: header
          schema:
            type: string
            example: websocket
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "401":
          description: Token y cookie ausentes o inválidos
          content:
            text/plain:
              schema:
                type: string
                example: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
      description: Token de sesión Better Auth (CLI device token o session token)
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Cookie de sesión Better Auth (nombre exacto puede incluir prefijo/host).
        El hub web usa `credentials: include`.

  parameters:
    ProviderParam:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/VaultProviderId"
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiffId:
      name: diffId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: Unauthorized
    BadRequest:
      description: Request inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    HealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    ErrorBody:
      type: object
      properties:
        error:
          type: string

    MeResponse:
      type: object
      required: [user]
