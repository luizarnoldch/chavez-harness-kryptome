            properties:
              id: { type: string }
              scope: { type: string, enum: [user, workspace] }
              title: { type: string }

    Workspace:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        path:
          type: string
        name:
          type: string
        userRulesEnabled:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkspaceWithConnections:
