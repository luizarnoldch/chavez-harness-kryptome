        - type: object
          properties:
            openConnections:
              type: integer
            daemonBound:
              type: boolean
            daemonConnections:
              type: integer
            daemonHostname:
              type: string
              nullable: true
            daemonPath:
              type: string
            daemonLastSeen:
              type: string
              format: date-time
              nullable: true
            daemonRole:
              type: string
              nullable: true
