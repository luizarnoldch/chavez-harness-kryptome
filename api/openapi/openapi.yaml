        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            User attaches: `{ attachments: [{ path, kind, status, byteSize, mime,
            truncated, listing, hydratedText, sha256 }] }`. Never `imageBase64`.
            Assistant rows may include `thinking: { text?, omitted?, durationMs? }`
            plus stream `status: finished|cancelled`.
            Tool rows: toolName, toolCallId, status, input, output.
        createdAt:
          type: string
          format: date-time

    TurnFileDiffPreview:
      type: object
      description: Sidecar de un path mutado en un turn. Nunca incluye `body`.
      properties:
        id: { type: string }
        chatId: { type: string }
        streamId: { type: string }
        toolCallId: { type: string, nullable: true }
        path: { type: string }
        kind: { type: string, enum: [created, modified, deleted] }
        status: { type: string, enum: [proposed, applied, rejected] }
        additions: { type: integer }
        deletions: { type: integer }
        preview: { type: string }
        truncated: { type: boolean }
        binary: { type: boolean }
        omitted: { type: boolean }
        byteSize: { type: integer, nullable: true }

    ConnectionPublic:
      type: object
      properties:
        connectionId:
          type: string
        workspaceId:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
          description: Bind path del workspace (workspaces.path); no cambia al worktree
        cwd:
          type: string
          nullable: true
          description: Path efectivo del daemon (worktree o bind)
        clientKind:
          type: string
          enum: [client, daemon]
        hostname:
          type: string
          nullable: true
          description: os.hostname() del proceso daemon; null en clientes web
        daemonId:
          type: string
          nullable: true
        role:
          type: string
          enum: [primary, standby, client]
        connectedAt:
          type: string
          format: date-time
        firstBoundAt:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        turnBusy:
          type: boolean

    # --- WebSocket protocol ---

    ClientMessage:
      type: object
      required: [type, id]
      description: Envelope base enviado por el cliente sobre el socket
      properties:
        type:
          type: string
        id:
          type: string
          description: Correlation id (eco en la respuesta)
        path:
          type: string
        title:
          type: string
        sessionId:
          type: string
        chatId:
          type: string
        role:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
          description: |
            Metadatos del mensaje. En `agent.turn.request`, `kind: code_review`
            activa el prompt efectivo de review y se reenvía al daemon sin hidratar diffs.
        query:
          type: string
        includeArchived:
          type: boolean
        archivedOnly:
          type: boolean
        pinned:
          type: boolean
        archived:
          type: boolean
        limit:
          type: integer
        offset:
          type: integer
        seq:
          type: integer
          description: Sequence number for chat.stream.delta (daemon is the source)
        streamId:
          type: string
        diffId:
          type: string
        diff:
          type: object
          additionalProperties: true
          description: Payload de chat.diff.upsert (preview; el body viaja aparte)
        action:
          type: string
          enum: [status, diff, commit, push, pr, branch, snapshot, local.set]
        requestId:
          type: string
        parentToolCallId:
          type: string
          description: Tool call padre para herramientas anidadas de subagentes.
        subagentId:
          type: string
          description: Identificador estable del subagente.
        message:
          type: string
        paths:
          type: array
          items:
            type: string
        body:
          type: string
        base:
          type: string
        name:
          type: string
        remote:
          type: string
        force:
          type: boolean

    ServerMessage:
      type: object
      required: [type, id, ok]
      description: Envelope de respuesta del servidor
      properties:
        type:
          type: string
        id:
          type: string
        ok:
          type: boolean
        data:
          description: Payload si ok=true
        error:
          type: string
          description: Mensaje si ok=false

    WsClientPing:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          properties:
            type:
              type: string
              enum: [ping]
          example:
            type: ping
            id: "1"

    WsServerPong:
      allOf:
        - $ref: "#/components/schemas/ServerMessage"
        - type: object
          example:
            type: pong
            id: "1"
            ok: true
            data:
              t: 1710000000000

    WsClientWorkspaceBind:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, path]
          properties:
            type:
              type: string
              enum: [workspace.bind]
            path:
              type: string
              description: Ruta absoluta del cwd
            clientKind:
              type: string
              enum: [client, daemon]
            hostname:
              type: string
              description: os.hostname() del daemon; opcional, solo con clientKind=daemon
            cwd:
              type: string
              description: Cwd efectivo restaurado del state file del daemon (opcional)
            daemonId:
              type: string
              description: UUID estable del proceso daemon para reclaim tras reconnect
          example:
            type: workspace.bind
            id: "1"
            path: /home/user/project

    WsClientWorktreeList:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [workspace.worktree.list]
    WsClientWorktreeAdd:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, branch]
          properties:
            type:
              type: string
              enum: [workspace.worktree.add]
            branch:
              type: string
            path:
              type: string
              description: Absoluto del checkout nuevo; default sibling basename-branch
    WsClientWorktreeSelect:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [workspace.worktree.select]
            path:
              type: string
              description: Absoluto del worktree o @main
            branch:
              type: string

    WsServerWorkspaceBind:
      allOf:
        - $ref: "#/components/schemas/ServerMessage"
        - type: object
          example:
            type: workspace.bind
            id: "1"
            ok: true
            data:
              workspace:
                id: uuid
                userId: uuid
                path: /home/user/project
                name: project

    WsClientWorkspaceUnbind:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          properties:
            type:
              type: string
              enum: [workspace.unbind]
          example:
            type: workspace.unbind
            id: "2"

    WsClientSessionCreate:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          properties:
            type:
              type: string
              enum: [session.create]
            title:
              type: string
          example:
            type: session.create
            id: "3"
            title: My session

    WsClientSessionList:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          properties:
            type:
              type: string
              enum: [session.list]
          example:
            type: session.list
            id: "4"

    WsClientChatCreate:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, sessionId]
          properties:
            type:
              type: string
              enum: [chat.create]
            sessionId:
              type: string
            title:
              type: string
          example:
            type: chat.create
            id: "5"
            sessionId: uuid
            title: Chat

    WsClientChatList:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, sessionId]
          properties:
            type:
              type: string
              enum: [chat.list]
            sessionId:
              type: string
            includeArchived:
              type: boolean
            archivedOnly:
              type: boolean
          example:
            type: chat.list
            id: "6"
            sessionId: uuid

    WsClientChatUpdate:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, chatId]
          properties:
            type:
              type: string
              enum: [chat.update]
            chatId:
              type: string
            title:
              type: string
            pinned:
              type: boolean
            archived:
              type: boolean
            sessionId:
              type: string
              description: Nueva sesión; debe pertenecer al mismo workspace.
          example:
            type: chat.update
            id: "update-1"
            chatId: uuid
            pinned: true

    WsClientChatSearch:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [chat.search]
            query:
              type: string
            content:
              type: string
              description: Alias legacy de query.
            sessionId:
              type: string
            includeArchived:
              type: boolean
            limit:
              type: integer
          example:
            type: chat.search
            id: "search-1"
            query: autenticación
            limit: 20

    WsPushChatUpdated:
      type: object
      required: [push, eventId, type, data]
      properties:
        push:
          type: boolean
          enum: [true]
        eventId:
          type: string
        type:
          type: string
          enum: [chat.updated]
        data:
          type: object
          required: [chat]
          properties:
            chat:
              $ref: "#/components/schemas/Chat"

    WsClientChatAppend:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, chatId, content]
          properties:
            type:
              type: string
              enum: [chat.append]
            chatId:
              type: string
            content:
              type: string
            role:
              type: string
              enum: [user, assistant, system]
              default: user
          example:
            type: chat.append
            id: "7"
            chatId: uuid
            role: user
            content: Hola

    WsClientChatGet:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, chatId]
          properties:
            type:
              type: string
              enum: [chat.get]
            chatId:
              type: string
          example:
            type: chat.get
            id: "8"
            chatId: uuid

    WsClientChatReplay:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, chatId]
          description: |
            Replay de un turn terminado. Respuesta `data`: `{ replay, text }`.
            Sin daemon. No despacha turn. `streamId` opcional = último terminado.
          properties:
            type:
              type: string
              enum: [chat.replay]
            chatId:
              type: string
            streamId:
              type: string
          example:
            type: chat.replay
            id: "9"
            chatId: uuid

    WsClientFsComplete:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, chatId]
          description: |
            Completar paths del cwd del daemon bound (máx 10).
            Respuesta `data`: `{ hostname, cwd, candidates: [{ path, isDir }] }`.
            Error sin daemon: el mismo string que `agent.turn.request`.
          properties:
            type:
              type: string
              enum: [fs.complete]
            chatId:
              type: string
            query:
              type: string
              description: Prefijo tras @; vacío = top 10 del cwd del daemon
          example:
            type: fs.complete
            id: "p1"
            chatId: "chat-uuid"
            query: "src/au"

    WsClientFsTree:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id]
          description: |
            Listar un directorio del cwd del daemon bound, filtrado por ignore.
            Respuesta `data`: `{ hostname, cwd, path, entries: [{ name, path, isDir }], truncated }`.
            Error sin daemon: el mismo string que `agent.turn.request`.
          properties:
            type:
              type: string
              enum: [fs.tree]
            path:
              type: string
              description: Directorio relativo al cwd del daemon; "." = raíz
          example:
            type: fs.tree
            id: "t1"
            path: "src"

    WsClientFsSearch:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [fs.search]
            query:
              type: string
              description: Substring de nombre/path; vacío no lista el cwd
          description: |
            Buscar por nombre en el cwd del daemon (máx 50 matches).
            Respuesta `data`: `{ hostname, cwd, query, matches: [{ path, isDir }], truncated }`.
            Error sin daemon: el mismo string que `agent.turn.request`.
          example:
            type: fs.search
            id: "s1"
            query: auth

    WsClientFsPreview:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          required: [type, id, path]
          properties:
            type:
              type: string
              enum: [fs.preview]
            path:
              type: string
              description: Relativo al cwd del daemon
          description: |
            Preview UI del cwd del daemon.
            Respuesta `data`: `{ hostname, cwd, path, kind, status, byteSize, mime?, truncated?, text?, mediaType?, imageBase64?, listing?, notice?, error? }`.
            `text` solo si `kind=text`. `imageBase64` solo si `kind=image` (efímero, no es campo de `chat_messages`).
            Error sin daemon: el mismo string que `agent.turn.request`.
          example:
            type: fs.preview
            id: "p1"
            path: src/auth.ts

    WsClientChatStreamReserved:
      allOf:
        - $ref: "#/components/schemas/ClientMessage"
        - type: object
          description: Stream/tool events desde daemon; API hace broadcast push
          properties:
            type:
              type: string
              enum:
                - chat.stream.start
                - chat.stream.delta
                - chat.thinking.delta
                - chat.thinking.end
                - chat.stream.end
                - chat.stream.error
                - chat.tool.start
                - chat.tool.result
                - chat.tool.update
                - agent.turn.request
                - agent.turn.started
                - agent.turn.ended
                - agent.turn.steer
                - agent.turn.steer.result
                - agent.turn.cancel
                - chat.steer
                - agent.tool.approve
                - agent.tool.deny
            status:
              type: string
              enum: [finished, cancelled]
              description: Estado terminal para `chat.stream.end`.
          example:
            type: chat.stream.start
            id: "9"
            chatId: uuid
            streamId: uuid
