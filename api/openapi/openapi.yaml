        title: { type: string }
        body: { type: string }
    UpdatePromptRequest:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        body: { type: string }
    MemoryMetadata:
      type: object
      properties:
        used: { type: integer }
        applied:
