openapi: 3.0.3
info:
  title: Chavez API
  version: 0.1.0
  description: |
    API del harness Chavez: auth (Better Auth + magic link + device), vault de providers,
    workspaces/sessions/chats por HTTP, y sincronización vía WebSocket `/ws`.

    **Auth:** Bearer (`Authorization: Bearer <session-token>`) o cookie de sesión Better Auth.
    Sign-in y sign-up usan el mismo email (magic link).

    **WebSocket:** conectar a `ws://<host>/ws?token=<token>` y enviar mensajes JSON
    `{ type, id, ... }` → respuesta `{ type, id, ok, data?, error? }`.

    Las rutas bajo `/api/auth/*` las atiende Better Auth (catch-all). Los shapes documentados
    reflejan el uso en este proyecto; detalles pueden variar con la versión del plugin.
  contact:
    name: Chavez
servers:
  - url: http://localhost:25001
    description: Stack local (API fija :25001)
tags:
  - name: Health
  - name: Me
  - name: Redirects
    description: Redirigen al hub web (`WEB_ORIGIN`, default :25002)
  - name: Auth
    description: Better Auth (`/api/auth/*`)
  - name: Device
    description: Device authorization (CLI login)
  - name: Providers
    description: |
      Vault por usuario. `claude` y `cursor` son LLM (catálogo + `activeProvider`).
      `github` es vault no-LLM (PAT); no entra en catalogs ni en `PUT /providers/active`.
  - name: Rules
    description: |
      Capa usuario (cuenta). CRUD de `user_rules` filtrado por `userId`.
      El toggle por workspace (`userRulesEnabled`) no borra las reglas.
  - name: Workspaces
  - name: Sessions
  - name: Chats
  - name: Prompts
    description: |
      Biblioteca de briefs de la cuenta (no skills, no AGENTS.md).
      CRUD HTTP sin daemon. Guardar no dispara un turn.
      Insertar ocurre en el compositor del cliente.
  - name: Memory
    description: |
      Facts durables por usuario y por workspace (no reglas de proyecto).
      Persistidos en Postgres; no escriben AGENTS.md. CRUD HTTP sin daemon.
      WS: `memory.changed` tras POST/DELETE; `agent.turn.dispatch` incluye `memories[]`;
      `chat.stream.end` puede traer `message.metadata.memory` `{ used, applied }`.
      No hay slash `/memory`.
  - name: Skills
    description: CRUD de skills de usuario (cuenta). POST manual usa source=manual.
  - name: Marketplace
    description: |
      Catálogo oficial HTTP y install/uninstall de skills de usuario.
      MCP install es solo WebSocket; la API nunca spawnea servidores MCP.
  - name: Share
    description: Links de solo lectura (no membresía, sin vault)
  - name: Connections
  - name: WebSocket
    description: Upgrade HTTP → WS; protocolo de mensajes documentado en components

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true

  /me:
    get:
      tags: [Me]
      summary: Usuario de la sesión actual
      operationId: getMe
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Sesión válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/onboarding:
    get:
      tags: [Me]
      summary: Snapshot del wizard de primer uso
      operationId: getMeOnboarding
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Pasos derivados + status persistido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Me]
      summary: Saltar o completar el wizard
      operationId: putMeOnboarding
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [skip, complete]
      responses:
        "200":
          description: Snapshot actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingSnapshot"
        "400":
          description: action inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: action must be skip or complete
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/usage:
    get:
      tags: [Me]
      summary: Usage reciente del usuario (sin secrets)
      description: |
        Últimos turns con blob de usage nativo (Claude/Cursor). No devuelve metadata
        cruda ni API keys. `emptyText` es exactamente `sin datos` cuando no hay filas.
      operationId: getMeUsage
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Usage reciente
          content:
            application/json:
              schema:
                type: object
                required: [recent, emptyText]
                properties:
                  emptyText:
                    type: string
                    example: sin datos
                  recent:
                    type: array
                    items:
                      type: object
                      properties:
                        chatId:
                          type: string
                        messageId:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        provider:
                          type: string
                        modelId:
                          type: string
                          nullable: true
                        display:
                          type: string
                          description: Misma línea que /cost (in/out/cache/$).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sign-in:
    get:
      tags: [Redirects]
      summary: Redirect al hub `/sign-in`
      operationId: redirectSignIn
      security: []
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
            default: /device
      responses:
        "302":
          description: Location → `{WEB_ORIGIN}/sign-in?redirect=…`
          headers:
            Location:
              schema:
                type: string
    post:
      tags: [Redirects]
      summary: Enviar magic link y redirect al hub
      description: |
        Form `application/x-www-form-urlencoded`. Llama a Better Auth `signInMagicLink`
        (sign-in y sign-up con el mismo email) y redirige al hub con `sent=1`.
      operationId: postSignIn
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                redirect:
                  type: string
                  default: /device
      responses:
        "302":
          description: Location → hub `/sign-in?sent=1…` o `?error=email`

  /device:
    get:
      tags: [Redirects]
      summary: Redirect al hub `/device`
      operationId: redirectDevice
      security: []
      parameters:
        - name: user_code
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Location → `{WEB_ORIGIN}/device`

  /device/approve:
    get:
      tags: [Redirects]
      summary: Redirect al hub `/device/approve`
      operationId: redirectDeviceApprove
      security: []
      parameters:
        - name: user_code
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Location → hub approve (o `/device` si falta user_code)

  /providers/link:
    get:
      tags: [Redirects]
      summary: Redirect al hub `/providers`
      operationId: redirectProvidersLink
      security: []
      parameters:
        - name: provider
          in: query
          schema:
            $ref: "#/components/schemas/VaultProviderId"
            default: claude
        - name: token
          in: query
          schema:
            type: string
          description: Access token opcional para el hub
      responses:
        "302":
          description: Location → `{WEB_ORIGIN}/providers?provider=…`
        "404":
          description: Provider desconocido
          content:
            text/plain:
              schema:
                type: string
                example: Unknown provider

  /api/auth/sign-in/magic-link:
    post:
      tags: [Auth]
      summary: Solicitar magic link (sign-in / sign-up)
      description: Better Auth. El primer uso crea la cuenta; los siguientes autenticán.
      operationId: authSignInMagicLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, callbackURL]
              properties:
                email:
                  type: string
                  format: email
                callbackURL:
                  type: string
                newUserCallbackURL:
                  type: string
                name:
                  type: string
            example:
              email: user@example.com
              callbackURL: http://localhost:25002/device
              name: User
      responses:
        "200":
          description: Magic link enviado (o escrito en `.dev-magic-link.txt` en no-prod)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/auth/magic-link/verify:
    get:
      tags: [Auth]
      summary: Verificar magic link
      description: Better Auth. Establece cookie de sesión y redirige a `callbackURL`.
      operationId: authMagicLinkVerify
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: callbackURL
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Sesión creada; Location → callbackURL
          headers:
            Set-Cookie:
              schema:
                type: string

  /api/auth/get-session:
    get:
      tags: [Auth]
      summary: Sesión actual (Better Auth)
      operationId: authGetSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Sesión o null
          content:
            application/json:
              schema:
                type: object
                nullable: true
                additionalProperties: true

  /api/auth/device/code:
    post:
      tags: [Device]
      summary: Iniciar device authorization (CLI)
      description: |
        Better Auth device plugin. Equivalente a `authClient.device.code`.
        Path exacto puede variar; el cliente Better Auth usa el plugin device.
      operationId: authDeviceCode
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  example: chavez-cli
                scope:
                  type: string
                  example: openid profile email
      responses:
        "200":
          description: Códigos de dispositivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"

  /api/auth/device:
    get:
      tags: [Device]
      summary: Claim device code (usuario autenticado)
      operationId: authDeviceClaim
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: user_code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claim OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/device/approve:
    post:
      tags: [Device]
      summary: Aprobar device code
      operationId: authDeviceApprove
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
                  description: User code sin guiones, mayúsculas
                  example: ABCD1234
      responses:
        "200":
          description: Aprobado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/device/token:
    post:
      tags: [Device]
      summary: Intercambiar device_code por access_token
      description: Poll hasta que el usuario apruebe. Better Auth device token grant.
      operationId: authDeviceToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, device_code, client_id]
              properties:
                grant_type:
                  type: string
                  example: urn:ietf:params:oauth:grant-type:device_code
                device_code:
                  type: string
                client_id:
                  type: string
                  example: chavez-cli
      responses:
        "200":
          description: Token emitido (o pending / slow_down según estado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenResponse"

  /providers/:
    get:
      tags: [Providers]
      summary: Listar providers, prefs y catálogos
      description: |
        models son nativos por provider; raw es el JSON recolectado.
        Query `refresh=1` fuerza rediscovery de Cursor. 401 sin sesión.
      operationId: listProviders
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Fuerza refresh del catálogo Cursor aunque el cache esté fresco.
      responses:
        "200":
          description: Estado de vault + catálogos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /providers/preferences:
    put:
      tags: [Providers]
      summary: Actualizar preferencias activas
      operationId: putProviderPreferences
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderPreferencesBody"
      responses:
        "200":
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderPreferences"
        "400":
          description: |
            Request inválido. Si `activeExecutionMode` no es `plan`, `auto` o `ask`,
            el body `error` es `executionMode must be plan, auto, or ask` y la fila no cambia.
            Si `activeModel` no pertenece a `activeProvider`, el body `error` nombra ambos
            (`modelId "…" does not belong to provider …`). Params Cursor inválidos usan
            `param "id=value" is not valid for model …`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: executionMode must be plan, auto, or ask
        "401":
          $ref: "#/components/responses/Unauthorized"

  /providers/active:
    put:
      tags: [Providers]
      summary: Fijar provider activo
      operationId: putActiveProvider
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  oneOf:
                    - $ref: "#/components/schemas/ProviderId"
                    - type: "null"
      responses:
        "200":
          description: Provider activo (modelo/params recortados al catálogo)
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeProvider:
                    oneOf:
                      - $ref: "#/components/schemas/ProviderId"
                      - type: "null"
                  activeModel:
                    type: string
                    nullable: true
                  activeEffort:
                    type: string
                    nullable: true
                  activeParams:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/CursorParamSelection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /providers/{provider}/credentials:
    parameters:
      - $ref: "#/components/parameters/ProviderParam"
    put:
      tags: [Providers]
      summary: Guardar / actualizar credenciales (vault)
      operationId: putProviderCredentials
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authKind, secret]
              properties:
                authKind:
                  $ref: "#/components/schemas/AuthKind"
                secret:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Credenciales guardadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  provider:
                    $ref: "#/components/schemas/ProviderId"
                  authKind:
                    $ref: "#/components/schemas/AuthKind"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Providers]
      summary: Leer credenciales desencriptadas
      description: |
        401 `{ "error": "Unauthorized" }` sin sesión. El secret se filtra por `userId`;
        el PAT de GitHub de A no es visible para B. `github` es vault, no LLM.
      operationId: getProviderCredentials
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Secret en claro (uso CLI / hub autenticado / daemon)
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    $ref: "#/components/schemas/VaultProviderId"
                  authKind:
                    $ref: "#/components/schemas/AuthKind"
                  secret:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Providers]
      summary: Eliminar credenciales
      operationId: deleteProviderCredentials
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rules:
    get:
      tags: [Rules]
      summary: Listar reglas de usuario de esta cuenta
      operationId: listUserRules
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Reglas del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Rules]
      summary: Crear regla de usuario
      operationId: createUserRule
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRuleWrite"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    $ref: "#/components/schemas/UserRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rules/{id}:
    put:
      tags: [Rules]
      summary: Actualizar regla de usuario
      operationId: updateUserRule
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRulePatch"
      responses:
        "200":
          description: Actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    $ref: "#/components/schemas/UserRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Rules]
      summary: Borrar regla de usuario
      operationId: deleteUserRule
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /skills:
    get:
      tags: [Skills]
      summary: Listar skills de usuario de esta cuenta
      operationId: listUserSkills
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Skills del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSkill"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Skills]
      summary: Crear skill de usuario
      operationId: createUserSkill
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSkillWrite"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill:
                    $ref: "#/components/schemas/UserSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /skills/{id}:
    put:
      tags: [Skills]
      summary: Actualizar skill de usuario
      operationId: updateUserSkill
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSkillPatch"
      responses:
        "200":
          description: Actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill:
                    $ref: "#/components/schemas/UserSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Skills]
      summary: Borrar skill de usuario
      operationId: deleteUserSkill
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /marketplace:
    get:
      tags: [Marketplace]
      summary: Vista del catálogo oficial con skills de usuario instalados
      operationId: getMarketplace
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Catálogo mergeado con estado de instalación
          content:
            application/json:
              schema:
                type: object
                required: [entries, errors, nativeToolsContinue]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/MarketplaceViewRow"
                  errors:
                    type: array
                    items:
                      type: string
                  nativeToolsContinue:
                    type: boolean
                    const: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /marketplace/install:
    post:
      tags: [Marketplace]
      summary: Instalar skill oficial en la cuenta del usuario
      description: |
        Solo `kind: skill`. MCP install es WebSocket-only; la API never spawns MCP servers.
      operationId: installMarketplaceSkill
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
