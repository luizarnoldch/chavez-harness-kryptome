            email:
              type: string
              format: email
            name:
              type: string

    ProviderId:
      type: string
      enum: [claude, cursor]
      description: LLM provider (activeProvider). GitHub no es un LLM.

    VaultProviderId:
      type: string
      enum: [claude, cursor, github]
      description: Credenciales del vault. `github` es PAT, runnable false.

    AuthKind:
      type: string
      enum: [oauth_token, api_key]

    EffortLevel:
      type: string
      enum: [none, low, medium, high, xhigh, max]

    ModelInfo:
      type: object
      description: Claude model (effortLevels + precios). Cursor usa CursorModelInfo.
